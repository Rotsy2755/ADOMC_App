services:
  php:
    build:
      context: .
      args:
        APP_ENV: dev
    container_name: adomc_php
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      APP_SECRET: changeme-dev-secret
      DATABASE_URL: mysql://app:secret@mysql:3306/mokp?serverVersion=8.0
      REDIS_URL: redis://redis:6379
      MAILER_DSN: smtp://mailtrap:secret@smtp.mailtrap.io:587
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: adomc-dev
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: adomc_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: adomc_mysql
    command: --default-authentication-plugin=caching_sha2_password --innodb_buffer_pool_size=512M
    environment:
      MYSQL_DATABASE: mokp
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: adomc_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      args:
        APP_ENV: dev
    container_name: adomc_worker
    command: >
      sh -c "php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv"
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      APP_SECRET: changeme-dev-secret
      DATABASE_URL: mysql://app:secret@mysql:3306/mokp?serverVersion=8.0
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  mysql_data:
  redis_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
