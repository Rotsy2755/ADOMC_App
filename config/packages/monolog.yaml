monolog:
    channels: ['deprecation', 'audit']

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            audit:
                type: stream
                path: "%kernel.logs_dir%/audit.log"
                level: info
                channels: [audit]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            audit:
                type: stream
                path: "%kernel.logs_dir%/audit.log"
                level: info
                channels: [audit]
