; Supervisor configuration for 2 Messenger workers (production).
; Place this file at /etc/supervisor/conf.d/adomc-worker.conf on the VPS.

[program:adomc-worker]
command=/usr/bin/php /var/www/adomc/bin/console messenger:consume async --time-limit=3600 --memory-limit=256M
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=3
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/adomc-worker.log
stopwaitsecs=20
stopsignal=TERM
