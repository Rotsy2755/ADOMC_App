server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 16m;

    # --- Security HTTP headers (see SecurityHeadersListener for dynamic CSP) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin" always;

    # Deny access to hidden files and common VCS paths.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 600;
        internal;
    }

    # Return 404 for all direct .php calls other than index.php.
    location ~ \.php$ {
        return 404;
    }

    # Gzip common textual assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/ld+json text/html image/svg+xml;

    error_log /var/log/nginx/adomc_error.log;
    access_log /var/log/nginx/adomc_access.log;
}
